<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin — BIOCRAFT DIGITAL</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body { background: #101415; color: #e0e3e5; font-family: 'Hanken Grotesk', sans-serif; }
  .glass-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
<nav class="flex justify-between items-center px-6 md:px-12 h-20 max-w-[1280px] mx-auto border-b border-white/10">
  <div class="flex items-center gap-2">
    <span class="material-symbols-outlined text-[#00dce5] text-3xl" style="font-variation-settings:'FILL'1">biotech</span>
    <span class="text-[#00dce5] font-bold" style="font-family:'Space Grotesk',sans-serif;font-size:24px">BIOCRAFT DIGITAL</span>
  </div>
  <div class="flex items-center gap-6">
    <button onclick="API.logout()" class="text-sm text-[#c7c6cd] hover:text-[#ffb4ab] transition-colors" style="font-family:'JetBrains Mono',monospace">LOGOUT</button>
  </div>
</nav>

<main class="max-w-[1280px] mx-auto px-6 md:px-12 py-12">
  <div class="glass-card rounded-2xl p-8">
    <h1 class="text-2xl font-bold mb-6" style="font-family:'Space Grotesk',sans-serif;color:#00dce5">INQUIRIES</h1>
    <div id="inquiries-container" class="space-y-4">
      <div class="text-sm text-[#c7c6cd]" style="font-family:'JetBrains Mono',monospace">Loading inquiries...</div>
    </div>
  </div>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/chat.js"></script>
<script>
(async function() {
  if (!API.isLoggedIn()) { window.location.href = "/"; return; }

  const user = await API.getMe();
  if (!user.is_admin) { window.location.href = "/"; return; }

  async function loadInquiries() {
    const inqs = await API.request("GET", "/admin/inquiries");
    const container = document.getElementById("inquiries-container");
    if (inqs.length === 0) {
      container.innerHTML = '<div class="text-sm text-[#c7c6cd]" style="font-family:\'JetBrains Mono\',monospace">No inquiries yet.</div>';
      return;
    }
    container.innerHTML = inqs.map(inq => {
      const statusColors = {
        pending: 'bg-yellow-500/20 text-yellow-400',
        in_review: 'bg-[#00dce5]/20 text-[#00dce5]',
        resolved: 'bg-[#2ae500]/20 text-[#2ae500]',
        closed: 'bg-white/10 text-[#c7c6cd]',
      };
      const statusColor = statusColors[inq.status] || 'bg-white/10 text-[#c7c6cd]';
      return `
        <div class="p-5 rounded-xl" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)">
          <div class="flex items-start justify-between mb-2">
            <div>
              <div class="text-sm font-bold text-[#e0e3e5]">${inq.subject}</div>
              <div class="text-xs text-[#c7c6cd] mt-1" style="font-family:'JetBrains Mono',monospace">
                User #${inq.user_id} — ${new Date(inq.created_at).toLocaleDateString()}
              </div>
            </div>
            <span class="px-2 py-0.5 rounded text-xs font-bold ${statusColor}" style="font-family:'JetBrains Mono',monospace">${inq.status.toUpperCase()}</span>
          </div>
          <div class="text-sm text-[#c7c6cd] mt-2 mb-4">${inq.message}</div>
          ${inq.admin_response ? `
            <div class="mb-4 p-3 rounded-lg" style="background:rgba(0,220,229,0.05);border:1px solid rgba(0,220,229,0.1)">
              <div class="text-xs font-bold text-[#00dce5] mb-1" style="font-family:'JetBrains Mono',monospace">YOUR RESPONSE:</div>
              <div class="text-sm text-[#e0e3e5]">${inq.admin_response}</div>
            </div>
          ` : ''}
          <div class="flex flex-wrap gap-3 items-end">
            <div>
              <label class="text-xs text-[#c7c6cd]/70 block mb-1" style="font-family:'JetBrains Mono',monospace">STATUS</label>
              <select id="status-${inq.id}" class="bg-[#0b0f10] border border-white/10 rounded-lg px-3 py-2 text-xs text-[#e0e3e5] outline-none">
                <option value="pending" ${inq.status === 'pending' ? 'selected' : ''}>Pending</option>
                <option value="in_review" ${inq.status === 'in_review' ? 'selected' : ''}>In Review</option>
                <option value="resolved" ${inq.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                <option value="closed" ${inq.status === 'closed' ? 'selected' : ''}>Closed</option>
              </select>
            </div>
            <div class="flex-1 min-w-[200px]">
              <label class="text-xs text-[#c7c6cd]/70 block mb-1" style="font-family:'JetBrains Mono',monospace">RESPONSE</label>
              <textarea id="response-${inq.id}" rows="2" class="w-full bg-[#0b0f10] border border-white/10 rounded-lg px-3 py-2 text-xs text-[#e0e3e5] outline-none resize-none" placeholder="Write admin response...">${inq.admin_response || ''}</textarea>
            </div>
            <button onclick="updateInquiry(${inq.id})"
              class="px-4 py-2 bg-[#00dce5] text-[#002021] text-xs font-bold rounded-lg hover:shadow-[0_0_15px_rgba(0,220,229,0.3)] transition-all whitespace-nowrap"
              style="font-family:'JetBrains Mono',monospace">UPDATE</button>
          </div>
        </div>
      `;
    }).join('');
  }

  window.updateInquiry = async function(inquiryId) {
    const status = document.getElementById(`status-${inquiryId}`).value;
    const response = document.getElementById(`response-${inquiryId}`).value;
    try {
      await API.request("PATCH", `/admin/inquiries/${inquiryId}`, { status, admin_response: response });
      await loadInquiries();
    } catch (err) {
      alert(`Error: ${err.message}`);
    }
  };

  await loadInquiries();
})();
</script>
</body>
</html>
